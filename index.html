// ---- LocalStorage-backed "memory" so the site remembers state per browser ----
function usePersistentState(key, initial) {
  const [state, setState] = useState(() => {
    try {
      const raw = window.localStorage.getItem(key);
      return raw ? JSON.parse(raw) : initial;
    } catch {
      return initial;
    }
  });
  useEffect(() => {
    try {
      window.localStorage.setItem(key, JSON.stringify(state));
    } catch {}
  }, [key, state]);
  return [state, state === undefined ? () => {} : setState, setState];
}

function MockRecaptcha({ checked, onCheck }) {
  const [loading, setLoading] = useState(false);
  const handleClick = () => {
    if (checked || loading) return;
    setLoading(true);
    setTimeout(() => { setLoading(false); onCheck(true); }, 700);
  };
  return (
    <div className="border border-white/[0.12] rounded-lg bg-white/[0.03] p-3 w-[260px] flex items-center gap-3">
      <button type="button" onClick={handleClick} className="w-6 h-6 rounded border border-white/20 bg-white/[0.05] flex items-center justify-center shrink-0">
        {loading && <div className="w-3.5 h-3.5 border-2 border-[#6C5CE7] border-t-transparent rounded-full animate-spin" />}
        {checked && !loading && <span className="text-[#34D6C4] text-[14px] leading-none">✓</span>}
      </button>
      <div className="text-[12.5px] text-[#C9C9DA]">I'm not a robot</div>
      <div className="ml-auto font-[JetBrains_Mono] text-[8px] text-[#5C5D75] leading-tight text-right">MOCK<br />CAPTCHA</div>
    </div>
  );
}

function LoginTab({ user, onLogin, onSignup }) {
  const [mode, setMode] = useState("login"); // "login" | "signup"

  const [confirm, setConfirm] = useState("");
  const [captcha, setCaptcha] = useState(false);
  const [discord, setDiscord] = useState(null);
  const [connecting, setConnecting] = useState(false);
  const [error, setError] = useState("");

  if (user) {
    return (
      <div className="max-w-5xl mx-auto px-6 pb-24">
        <div className="border-t border-white/[0.07] pt-8 max-w-md">

          {user.role !== "Owner" && (
            <p className="text-[12.5px] text-[#5C5D75]">Only the owner account sees the admin panel. Everyone else gets a normal member session.</p>
          )}
        </div>
      </div>
    );
  }

  const connectDiscord = () => {
    if (connecting || discord) return;
    setConnecting(true);
    setTimeout(() => { setConnecting(false); setDiscord(username ? `${username}#0421` : "member#0421"); }, 900);
  };

  const submit = () => {
    setError("");
    if (mode === "signup" && password !== confirm) {
      setError("Passwords don't match.");
      return;
    }
    const result = mode === "login" ? onLogin(username, password) : onSignup(username, password);
    if (!result.ok) setError(result.error);
  };

  const canSubmit = username && password && discord && captcha && (mode === "login" || confirm);

  return (
    <div className="max-w-5xl mx-auto px-6 pb-24">
      <div className="border-t border-white/[0.07] pt-8 max-w-md">
        <div className="flex gap-1 mb-5 bg-white/[0.04] rounded-full p-1 w-fit">

          <button onClick={() => { setMode("signup"); setError(""); }} className={`px-3.5 py-1.5 text-[12.5px] rounded-full transition-colors ${mode === "signup" ? "bg-white text-[#0B0B10]" : "text-[#8B8CA3]"}`}>Sign up</button>
        </div>
        <h2 className="font-[Space_Grotesk] text-[20px] text-[#F4F3F8] mb-1">{mode === "login" ? "Log in" : "Create an account"}</h2>
        <p className="text-[13.5px] text-[#8B8CA3] mb-6 leading-relaxed">
          {mode === "login" ? "The owner logs in with their real password. Everyone else uses the account they signed up with." : "Accounts are saved in this browser's storage — sign up once, then log in anytime."}
        </p>

        <div className="space-y-4">
          <Field label="Username" placeholder="e.g. Fenrix" onValue={setUsername} value={username} />
          <Field label="Password" placeholder="••••••••" type="password" onValue={setPassword} value={password} />
          {mode === "signup" && (
            <Field label="Confirm password" placeholder="••••••••" type="password" onValue={setConfirm} value={confirm} />
          )}

          <div>
            <label className="text-[12px] text-[#8B8CA3] block mb-1.5">Discord verification</label>
            {discord ? (
              <div className="flex items-center gap-2 text-[12.5px] text-[#34D6C4] bg-[#34D6C4]/10 border border-[#34D6C4]/20 rounded-lg px-3 py-2">
                <span>✓</span> Connected as {discord}
              </div>
            ) : (
              <button type="button" onClick={connectDiscord} className="w-full flex items-center justify-center gap-2 bg-[#5865F2] hover:bg-[#4a55d6] text-white text-[13px] font-medium px-4 py-2.5 rounded-lg transition-colors">
                {connecting ? "Connecting…" : "Verify with Discord"}
              </button>
            )}
            <p className="text-[11px] text-[#5C5D75] mt-1.5 leading-relaxed">
              In production this uses Discord OAuth2 plus a bot that checks server membership and assigns your verified role automatically.
            </p>
          </div>

          <div>
            <label className="text-[12px] text-[#8B8CA3] block mb-1.5">Verification</label>
            <MockRecaptcha checked={captcha} onCheck={setCaptcha} />
          </div>

          {error && <p className="text-[12px] text-[#FF5FA2]">{error}</p>}

          <button
            type="button"
            disabled={!canSubmit}
            onClick={submit}
            className="bg-white text-[#0B0B10] text-[13.5px] font-medium px-5 py-2.5 rounded-full hover:bg-[#6C5CE7] hover:text-white transition-colors disabled:opacity-30 disabled:pointer-events-none"
          >
            {mode === "login" ? "Log in" : "Create account"}
          </button>
        </div>
      </div>
    </div>
  );
}

function AdminTab({ demons, setDemons, staff, setStaff }) {
  const [form, setForm] = useState({ name: "", creator: "", verifier: "", points: "" });
  const [formError, setFormError] = useState("");
  const [newStaffName, setNewStaffName] = useState("");
  const [newStaffRole, setNewStaffRole] = useState("Moderator");

  const addLevel = () => {
    if (!form.name.trim()) { setFormError("Level name is required."); return; }
    if (!form.points.trim() || isNaN(Number(form.points))) { setFormError("Points must be a number."); return; }
    setFormError("");
    const points = Number(form.points);
    const nextRank = demons.length + 1;
    const updated = [...demons, { rank: nextRank, name: form.name, creator: form.creator || "Unknown", verifier: form.verifier || "Unverified", points }]
      .sort((a, b) => b.points - a.points)
      .map((d, i) => ({ ...d, rank: i + 1 }));
    setDemons(updated);
    setForm({ name: "", creator: "", verifier: "", points: "" });
  };

  const removeLevel = (rank) => {
    const updated = demons.filter((d) => d.rank !== rank).sort((a, b) => b.points - a.points).map((d, i) => ({ ...d, rank: i + 1 }));
    setDemons(updated);
  };

  const changeRole = (name, role) => setStaff(staff.map((s) => (s.name === name ? { ...s, role } : s)));
  const removeStaff = (name) => setStaff(staff.filter((s) => s.name !== name));

  const addStaff = () => {
    if (!newStaffName.trim()) return;
    setStaff([...staff, { name: newStaffName, role: newStaffRole, note: "Added by owner." }]);
    setNewStaffName("");
  };

  const resetToDefaults = () => {
    setDemons(INITIAL_DEMONS);
    setStaff(INITIAL_STAFF);
  };

  return (
    <div className="max-w-5xl mx-auto px-6 pb-24">
      <div className="flex items-center justify-between mb-6">
        <p className="text-[12px] text-[#5C5D75]">Levels and roles are saved in this browser's storage.</p>
        <button onClick={resetToDefaults} className="text-[11.5px] text-[#8B8CA3] hover:text-[#FF5FA2] transition-colors">
          Reset to defaults
        </button>
      </div>
      <div className="grid gap-12 md:grid-cols-2">
      <div>
        <h2 className="font-[Space_Grotesk] text-[19px] text-[#F4F3F8] mb-1">Manage levels</h2>
        <p className="text-[12.5px] text-[#8B8CA3] mb-5">Add a demon or remove one — the list re-ranks by points automatically.</p>
        <div className="space-y-3 mb-6">
          <Field label="Level name *" placeholder="e.g. Null Horizon" value={form.name} onValue={(v) => setForm({ ...form, name: v })} />
          <div className="grid grid-cols-2 gap-3">
            <Field label="Creator" placeholder="e.g. Kataclysm" value={form.creator} onValue={(v) => setForm({ ...form, creator: v })} />
            <Field label="Verifier" placeholder="e.g. Kawaii Vyrien" value={form.verifier} onValue={(v) => setForm({ ...form, verifier: v })} />
          </div>
          <Field label="Points *" placeholder="e.g. 350" value={form.points} onValue={(v) => setForm({ ...form, points: v })} />
          {formError && <p className="text-[12px] text-[#FF5FA2]">{formError}</p>}
          <button onClick={addLevel} className="bg-white text-[#0B0B10] text-[13px] font-medium px-4 py-2 rounded-full hover:bg-[#6C5CE7] hover:text-white transition-colors">
            Add level
          </button>
        </div>
        <div className="space-y-1.5 max-h-72 overflow-y-auto pr-1">
          {demons.map((d) => (
            <div key={d.rank} className="flex items-center justify-between text-[12.5px] border border-white/[0.08] rounded-lg px-3 py-2">
              <span className="text-[#C9C9DA]">#{d.rank} · {d.name}</span>
              <button onClick={() => removeLevel(d.rank)} className="text-[#FF5FA2] hover:text-[#ff8ab8] text-[11px]">Remove</button>
            </div>
          ))}
        </div>
      </div>

      <div>
        <h2 className="font-[Space_Grotesk] text-[19px] text-[#F4F3F8] mb-1">Manage roles</h2>
        <p className="text-[12.5px] text-[#8B8CA3] mb-5">Promote, demote, or remove staff members.</p>
        <div className="space-y-2 mb-6">
          {staff.map((s) => (
            <div key={s.name} className="flex items-center gap-3 border border-white/[0.08] rounded-lg px-3 py-2">
              <span className="text-[13px] text-[#F4F3F8] flex-1 truncate">{s.name}</span>
              <select value={s.role} onChange={(e) => changeRole(s.name, e.target.value)} className="bg-white/[0.05] border border-white/[0.12] rounded-md text-[12px] text-[#C9C9DA] px-2 py-1 focus:outline-none">
                {ROLES.map((r) => <option key={r} value={r} className="bg-[#14141C]">{r}</option>)}
              </select>
              <button onClick={() => removeStaff(s.name)} className="text-[#FF5FA2] hover:text-[#ff8ab8] text-[11px]">Remove</button>
            </div>
          ))}
        </div>
        <div className="flex gap-2">
          <input value={newStaffName} onChange={(e) => setNewStaffName(e.target.value)} placeholder="New staff username" className="flex-1 bg-white/[0.03] border border-white/[0.1] rounded-lg px-3 py-2 text-[12.5px] text-[#F4F3F8] placeholder:text-[#5C5D75] focus:outline-none focus:ring-2 focus:ring-[#6C5CE7]/40 focus:border-[#6C5CE7]" />
          <select value={newStaffRole} onChange={(e) => setNewStaffRole(e.target.value)} className="bg-white/[0.05] border border-white/[0.12] rounded-md text-[12px] text-[#C9C9DA] px-2 focus:outline-none">
            {ROLES.map((r) => <option key={r} value={r} className="bg-[#14141C]">{r}</option>)}
          </select>
          <button onClick={addStaff} className="bg-white text-[#0B0B10] text-[12.5px] font-medium px-3.5 rounded-lg hover:bg-[#6C5CE7] hover:text-white transition-colors">Add</button>
        </div>
      </div>
      </div>
    </div>
  );
}

function DemonListSite() {
  const [active, setActive] = useState("List");
  const [demons, setDemons] = usePersistentState("gd_demons", INITIAL_DEMONS);
  const [staff, setStaff] = usePersistentState("gd_staff", INITIAL_STAFF);
  const [users, setUsers] = usePersistentState("gd_users", {});
  const [user, setUser] = useState(null);

  const handleLogin = (username, password) => {
    const key = username.trim().toLowerCase();
    if (key === OWNER_USERNAME && password === OWNER_PASSWORD) {
      setUser({ name: "Kawaii Vyrien", role: "Owner" });
      setActive("Admin");
      return { ok: true };
    }
    const record = users[key];
    if (!record || record.password !== password) {
      return { ok: false, error: "Incorrect username or password." };
    }
    setUser({ name: record.username, role: record.role });
    setActive("List");
    return { ok: true };
  };

  const handleSignup = (username, password) => {
    const key = username.trim().toLowerCase();
    if (!username.trim()) return { ok: false, error: "Username is required." };
    if (key === OWNER_USERNAME) return { ok: false, error: "That username is reserved." };
    if (users[key]) return { ok: false, error: "That username is already taken." };
    const updated = { ...users, [key]: { username, password, role: "Member" } };
    setUsers(updated);
    setUser({ name: username, role: "Member" });
    setActive("List");
    return { ok: true };
  };

  const handleLogout = () => { setUser(null); setActive("List"); };

  return (
    <div className="min-h-screen font-[Inter] text-[#F4F3F8]">
      <Backdrop />
      <Nav active={active} setActive={setActive} user={user} onLogout={handleLogout} />
      <Hero demonCount={demons.length} />
      {active === "List" && <ListTab demons={demons} />}
      {active === "Leaderboard" && <LeaderboardTab />}
      {active === "Moderators" && <ModeratorsTab staff={staff} />}
      {active === "Submit" && <SubmitTab />}
      {active === "Login" && <LoginTab user={user} onLogin={handleLogin} onSignup={handleSignup} />}
      {active === "Admin" && user?.role === "Owner" && (
        <AdminTab demons={demons} setDemons={setDemons} staff={staff} setStaff={setStaff} />
      )}
      <footer className="border-t border-white/[0.07] py-8">
        <div className="max-w-5xl mx-auto px-6 text-[12px] text-[#8B8CA3]">
          Data is saved in this browser's local storage. Discord verification and reCAPTCHA are UI mocks — a real deployment needs a backend.
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<DemonListSite />);
</script>
</body>
</html>
